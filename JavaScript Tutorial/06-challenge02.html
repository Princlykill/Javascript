<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <style></style>
</head>

<body>
</body>

<script>

    let hour = 11;
    let name = "Marvellous";
    let age = 70;
    const isHoliday = false;
    let randomNumber = Math.random();
    let result = '';
    let guess = 'heads';


    if (hour >= 6 && hour < 12) {
        console.log(`Good morning ${name}!`);
    } else if (hour >= 12 && hour < 16) {
        console.log(`Good afternoon ${name}!`);
    } else if (hour >= 16 && hour < 20) {
        console.log(`Good evening ${name}!`);
    } else {
        console.log(`Good night ${name}!`);
    }

    if ((age <= 6 || age >= 65) && !isHoliday) {
        console.log(`${name} is eligible for Discount.`);
    } else {
        console.log(`${name} is not eligible for Discount.`);
    }
    
    if (randomNumber < 0.5) {
        result = 'heads';
    } else {
        result = 'tails';
    }
    console.log(result);

    if (guess === result) {
        console.log('You win!');
    } else {
        console.log('You lose!');
    } 

</script>

</html>
