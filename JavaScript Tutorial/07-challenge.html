<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style></style>
</head>

<body>
  <h1>Rock Paper Scissors</h1>


  <p>
    <button onclick="
    playGame('rock');
    ">Rock</button>


    <button onclick="
    playGame('paper');
        ">Paper</button>



    <button onclick="
      playGame('scissors');
    ">Scissors</button>



  </p>

  <script>

    function playGame(playerMove) {
      const compMove = pickComouterMove();
      let result = '';
      
      if (playerMove === 'scissors') {

        if (compMove === 'rock') {
          result = 'You lose.';
        } else if (compMove === 'paper') {
          result = 'You win';
        } else if (compMove === 'scissors') {
          result = 'Tie';
        } alert(`You picked ${playerMove}. Computer picked ${compMove}. ${result}`);

      } else if (playerMove === 'paper') {
        if (compMove === 'rock') {
          result = 'You win.';
        } else if (compMove === 'paper') {
          result = 'Tie';
        } else if (compMove === 'scissors') {
          result = 'You lose';
        } alert(`You picked paper. Computer picked ${compMove}. ${result}`);

      } else if (playerMove === 'rock') {
        if (compMove === 'rock') {
          result = 'Tie.';
        } else if (compMove === 'paper') {
          result = 'You lose';
        } else if (compMove === 'scissors') {
          result = 'You win';
        }

        alert(`You picked rock. Computer picked ${compMove}. ${result}`);
      }

    }

    function pickComouterMove() {

      const randomNumber = Math.random();

      let compMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        compMove = 'rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        compMove = 'paper';
      } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        compMove = 'scissors';
      }

      console.log(compMove);
      return compMove;
    }
  </script>
</body>

</html>
