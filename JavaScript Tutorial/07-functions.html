         function convertLength(length, from, to) {

            if (from !== 'km' && from !== 'miles' && from !== 'ft') {
                return `invalid input ${from}`;
            } else if (to !== 'km' && to !== 'miles' && to !== 'ft') {
                return `invalid input ${to}`;
            }

            if (from === 'km' && to === 'miles') {
                return `${length / 1.6}miles`;
            } else if (from === 'miles' && to === 'km') {
                return `${length * 1.6}km`;
            } else if (from === to) {
                return `${length} ${to}`;
            } else if (from === 'miles' && to === 'ft') {
                return `${length * 5280}ft`;
            } else if (from === 'ft' && to === 'miles') {
                return `${length / 5280}miles`;
            } else if (from === 'km' && to === 'ft') {
                return `${length * 3281}ft`;
            } else if (from === 'ft' && to === 'km') {
                return `${length / 3281}km`;
            }
         }

         console.log(convertLength(25, 'miles', 'km'));
         console.log(convertLength(35, 'km', 'miles'));
         console.log(convertLength(45, 'miles', 'miles'));
         console.log(convertLength(45, 'miles', 'ft'));
         console.log(convertLength(45, 'ft', 'miles'));
         console.log(convertLength(45, 'km', 'ft'));
         console.log(convertLength(5, 'ft', 'km'));
         console.log(convertLength(50, 'lbs', 'lbs'));
